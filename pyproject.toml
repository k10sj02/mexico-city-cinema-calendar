[project]
name = "mexico-city-cinema-calendar"
version = "1.0.0"
description = "Automated iCalendar feed for Mexico City cinema showtimes"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "icalendar>=6,<7"]

[project.scripts]
mexico-city-cinema-calendar = "mexico_city_cinema_calendar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
